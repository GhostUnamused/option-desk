<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Optionwise</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="96x96" href="/icons/favicon-96x96.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/android-chrome-192x192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0F0F0F">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/app.css">
<script src="/vendor/lightweight-charts.standalone.production.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">Optionwise</span></div>
  <div class="vix" id="vixBox" aria-live="polite" hidden></div>
  <div class="tickers" id="tickers" aria-label="Index quotes"></div>
  <div class="session" id="session" aria-live="off" hidden></div>
  <button class="acct" id="acctMini" type="button" title="Open positions"></button>
</header>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="learn">Learn</button>
  <button role="tab" data-tab="markets">Markets</button>
  <button role="tab" data-tab="chain">Option chain</button>
  <button role="tab" data-tab="strategy">Strategy builder</button>
  <button role="tab" data-tab="positions">Paper account</button>
  <button role="tab" data-tab="replay" hidden>Replay</button>
  <span class="tab-ink" id="tabInk" aria-hidden="true"></span>
  <span class="tabs-sym" id="symLabel"></span>
  <button class="pill" id="srcPill" type="button" hidden>Connecting</button>
  <button class="btn ghost sm" id="modeBtn" type="button" hidden></button>
  <button class="pill" id="updPill" type="button" hidden></button>
  <button class="btn ghost sm help" id="guideBtn" type="button" title="Show the beginner guide on the Markets tab">Beginner guide</button>
</nav>
<div class="replay-bar" id="replayBar" hidden aria-label="Replay controls"></div>

<main>
  <section class="tab" id="tab-learn" role="tabpanel" hidden></section>
  <section class="tab" id="tab-markets" role="tabpanel" hidden></section>
  <section class="tab" id="tab-chain" role="tabpanel" hidden></section>
  <section class="tab" id="tab-strategy" role="tabpanel" hidden></section>
  <section class="tab" id="tab-positions" role="tabpanel" hidden></section>
  <section class="tab" id="tab-replay" role="tabpanel" hidden></section>
</main>

<dialog id="ticket" aria-label="Order ticket"></dialog>
<dialog id="broker" class="sheet" aria-label="Connect a broker"></dialog>
<dialog id="stocks" class="sheet" aria-label="Stock options"></dialog>
<aside id="drawer" class="drawer" hidden aria-label="Option detail"></aside>
<div id="toasts" class="toasts" aria-live="polite"></div>
<footer class="foot">Paper trading only. Prices come from your selected broker, or from NSE's public website if you chose it, which can lag, rate-limit or change without notice. Charges and margins are estimates. Nothing here is investment advice. <span id="appVer"></span>Charts by <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView Lightweight Charts</a>.</footer>
<script type="module" src="/js/app.js"></script>
</body>
</html>
